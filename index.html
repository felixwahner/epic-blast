<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<title>EPIC BLAST - Retro Block Puzzle</title>
		<meta name="theme-color" content="#0c0d14" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Epic Blast" />
		<link rel="manifest" href="./manifest.webmanifest" />
		<link rel="apple-touch-icon" href="./icons/icon-180.png" />

	</head>
	<body>
		<div id="game-container">
			<!-- Top Header / Scoreboard -->
			<header class="game-header">
				<div class="header-left">
					<h1 class="game-title"><img class="game-logo" src="./src/assets/branding/epic-blast-logo-concept.png" alt="EPIC BLAST" width="1536" height="1024" /></h1>
				</div>
				<div class="header-controls">
					
					<button id="btn-options" class="pixel-btn" aria-haspopup="dialog" aria-controls="options-menu" aria-label="Optionen öffnen" title="Optionen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.6 2.3-1.6.9L5 5.6 2.5 10l1.7 1.7v1.8L2.5 15 5 19.4l2.3-.6 1.6.9.6 2.3h5l.6-2.3 1.6-.9 2.3.6 2.5-4.4-1.7-1.5v-1.8L21.5 10 19 5.6l-2.3.6-1.6-.9L14.5 3Z"/><circle cx="12" cy="12.5" r="3"/></svg></button>
</div>
			</header>

			<div class="scoreboard">
				<div class="score-card">
					<span class="score-label">SCORE</span>
					<span id="score-display" class="score-value">0</span>
				</div>
				<div class="score-card best">
					<span class="score-label">BEST</span>
					<span id="best-score-display" class="score-value">0</span>
				</div>
			</div>

			
<!-- Main Game Viewport (Pixi.js attaches here) -->
			<div id="canvas-wrapper">
				<div id="pixi-view">
					<div class="combo-box tray-combo" id="combo-box">
						<span class="score-label">COMBO</span>
						<span id="combo-display" class="score-value highlight">0</span>
					</div>
				</div>

				<!-- Overlay for Game Over -->
				<div id="game-over-modal" class="modal-overlay hidden">
					<div class="modal-box pixel-border">
						<h2 class="modal-title flash-text">GAME OVER</h2>
						<div class="modal-scores">
							<div class="modal-row">
								<span>SCORE:</span>
								<span id="final-score" class="score-highlight">0</span>
							</div>
							<div class="modal-row">
								<span>BEST:</span>
								<span id="final-best" class="score-highlight">0</span>
							</div>
						</div>
						<div id="new-record-badge" class="badge hidden">✨ NEW RECORD! ✨</div>
						<div class="modal-actions">
							<button
								id="btn-revive"
								class="pixel-btn revive-btn"
								title="Einen Revive einsetzen und weiterspielen"
							>
								REVIVE (1)
							</button>
							<button id="btn-play-again" class="pixel-btn play-again-btn">PLAY AGAIN</button>
						</div>
					</div>
				</div>
			</div>
		<div class="level-status">
<div id="world-label" class="world-label">NEON ARCADE</div>
  <div class="level-summary"><span id="level-label">LEVEL 1</span><span id="revive-count">REVIVES: 1</span></div>
  <progress id="level-progress" max="1" value="0" aria-label="Level progress"></progress>
  <span id="level-target">0 / 100,000 · +1 REVIVE</span>
</div>
</div>

		<dialog id="options-menu" class="options-menu" aria-labelledby="options-title">
  <div class="options-heading"><h2 id="options-title">OPTIONEN</h2><button id="btn-close-options" class="pixel-btn" aria-label="Optionen schließen">✕</button></div>
  <p class="options-subtitle">TUNE YOUR BLAST</p>
  <div id="fullscreen-option" class="option-row" hidden><span>Vollbild</span><button id="btn-fullscreen" class="pixel-btn" title="Vollbild aktivieren" aria-label="Vollbild aktivieren" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6" /></svg></button></div>
  <div class="option-row"><span>Sound</span><button id="btn-sound" class="pixel-btn" title="Toggle Sound" aria-label="Toggle Sound">🔊</button></div>
  <div class="option-row"><span>Hintergrundmusik</span><button id="btn-music" class="pixel-btn" aria-label="Hintergrundmusik" aria-pressed="true">AN</button></div>
<div class="option-row"><span>Vibration</span><button id="btn-vibration" class="pixel-btn" title="Vibration ausschalten" aria-label="Vibration ausschalten" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 8v8M1 10v4m19-6v8m3-6v4"/><path class="vibration-slash" d="m3 3 18 18"/></svg></button></div>
  <div class="option-row"><span>Visuelle Effekte</span><button id="btn-effects" aria-pressed="false">EFFEKTE: VOLL</button></div>
  <div class="option-row option-restart"><span>Neues Spiel</span><button id="btn-restart" class="pixel-btn" title="Restart Game" aria-label="Restart">🔄</button></div>
</dialog>
<dialog id="streak-recovery" class="options-menu" aria-labelledby="recovery-title">
  <div class="options-heading"><h2 id="recovery-title">KOMBO RETTEN</h2></div>
  <p id="recovery-message" class="recovery-message"></p>
  <div class="recovery-actions">
    <button id="btn-recover-streak" class="pixel-btn revive-btn">RETTEN · 1 REVIVE</button>
    <button id="btn-skip-recovery" class="pixel-btn">WEITER OHNE RETTUNG</button>
  </div>
</dialog>
<div id="install-banner" class="install-banner" role="region" aria-label="App installieren" hidden>
  <img class="install-icon" src="./icons/icon-192.png" alt="" width="40" height="40" />
  <p class="install-text"><strong>EPIC BLAST ALS APP</strong><span id="install-hint">Im Vollbild und offline spielen</span></p>
  <button id="btn-install" class="pixel-btn">INSTALLIEREN</button>
  <button id="btn-install-close" class="pixel-btn" aria-label="Hinweis schließen" title="Schließen">✕</button>
</div>
<script type="module" src="./src/main.ts"></script>
	</body>
</html>
